<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121416">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reversi">
  <title>Reversi Trainer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section class="board-area">
      <div class="frame">
        <div class="coords cols" aria-hidden="true">
          <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
        </div>
        <div class="coords rows" aria-hidden="true">
          <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
        </div>
        <div id="board" class="board" role="grid" aria-label="Reversi board"></div>
      </div>

      <!-- Training answers by move number -->
      <div class="move-chart train-only" id="move-chart">
        <div class="mc-head">
          <span class="mc-title">Answers by move</span>
          <span class="mc-legend"><i class="ok"></i>correct <span class="tr-book"><i class="wa"></i>with Umigame warning</span> <i class="no"></i>wrong</span>
          <span class="mc-tabs">
            <button id="mc-session" class="small active">Session</button>
            <button id="mc-all" class="small">All-time</button>
          </span>
        </div>
        <div class="mc-bars" id="mc-bars"></div>
        <div class="mc-axis" id="mc-axis"></div>
        <div class="mc-info" id="mc-info">Tap or hover a bar for its numbers.</div>
      </div>
    </section>

    <aside class="panel">
      <h1>Reversi Trainer</h1>

      <div class="tabs" role="tablist">
        <button id="tab-analyse" class="tab active" role="tab">Analyse</button>
        <button id="tab-train" class="tab" role="tab">Train</button>
        <button id="tab-endgame" class="tab" role="tab">Endgame</button>
      </div>

      <div class="score">
        <div class="side" id="side-black">
          <span class="chip black"></span><span class="count" id="count-black">2</span>
        </div>
        <div class="status" id="status">Black to move</div>
        <div class="side" id="side-white">
          <span class="count" id="count-white">2</span><span class="chip white"></span>
        </div>
      </div>

      <!-- Training -->
      <div class="train-only train">
        <div class="train-setup">
          <label class="tr-book">You play
            <select id="opt-train-color">
              <option value="1">Black</option>
              <option value="2">White</option>
              <option value="3">Both</option>
            </select>
          </label>
          <label class="tr-book" title="The trainer picks book moves within this many discs of the best book move">Opponent within
            <select id="opt-train-margin">
              <option value="0">0</option><option value="1">1</option><option value="2">2</option>
              <option value="3">3</option><option value="4">4</option><option value="6">6</option>
            </select> discs
          </label>
          <label class="tr-book" title="The trainer never plays a book move scoring below this for itself (if no allowed move is good enough, it plays the best one)">Never worse than
            <select id="opt-train-floor">
              <option value="all">All</option><option value="0">0</option><option value="-2">-2</option>
              <option value="-4">-4</option><option value="-6">-6</option><option value="-8">-8</option>
              <option value="-10">-10</option><option value="-12">-12</option><option value="-14">-14</option>
              <option value="-16">-16</option>
            </select>
          </label>
          <label class="tr-end" title="The trainer plays a move within this many discs of the best (exact solve); 0 = perfect play">Opponent within
            <select id="opt-end-margin">
              <option value="0">0 (perfect)</option><option value="1">1</option><option value="2">2</option>
              <option value="3">3</option><option value="4">4</option>
            </select> discs
          </label>
          <div class="tr-end end-scores" id="end-scores" title="Start positions (after 39 or 40 moves, from the book) where your score is one of the ticked values"><span>Start score</span></div>
          <label class="tr-book" title="Longest time Edax may take to check a move that is not in the book, and to score positions while you play on. When it runs out, the deepest level finished is used.">Time cap
            <select id="opt-train-cap">
              <option value="1">1 s</option><option value="2">2 s</option><option value="3">3 s</option>
              <option value="5">5 s</option><option value="10">10 s</option><option value="30">30 s</option>
              <option value="0">none</option>
            </select>
          </label>
          <label title="Every saved position comes up again on this day at the latest. Leave empty for no deadline.">Review by
            <input type="date" id="opt-deadline">
          </label>
          <label title="Only drill saved positions: due ones first, then the rest, the longest unseen first. The line ends after the reviewed position."><input type="checkbox" id="opt-reviews-only"> Reviews only</label>
        </div>
        <div class="feedback" id="train-feedback">Open your book, then press Start.</div>
        <div class="train-actions">
          <button id="btn-train-start" class="primary">Start</button>
          <button id="btn-train-retry" hidden>Retry</button>
          <button id="btn-train-accept" hidden title="Count your move as correct, continue the line with it and do not save the position for review">Accept</button>
          <button id="btn-train-best" hidden>Play best &amp; continue</button>
          <button id="btn-train-next" hidden>Next line</button>
          <button id="btn-train-copy" hidden title="Copies the moves of this line and the colour you trained">Copy transcript with colour</button>
        </div>
        <div class="train-explore" id="train-explore"></div>
        <div class="train-stats" id="train-stats"></div>
      </div>

      <!-- Move navigation: always in Analyse; in Train while playing on after a mistake or out of book -->
      <div class="nav">
        <button id="btn-first" title="First (Home)">&#x23EE;</button>
        <button id="btn-back" title="Back (&larr;)">&#x25C0;</button>
        <button id="btn-fwd" title="Forward (&rarr;)">&#x25B6;</button>
        <button id="btn-last" title="Last (End)">&#x23ED;</button>
      </div>

      <!-- Analysis -->
      <div class="analyse-only">
        <div class="options">
          <button id="btn-new" class="wide">New game</button>
          <label class="toggle"><input type="checkbox" id="opt-hints" checked> Show legal moves</label>
          <label class="toggle" title="Place discs a little off-centre in their squares, as on a real board">Disc placement
            <select id="opt-jitter">
              <option value="off">Centred</option><option value="slight">Slightly random</option><option value="strong">More random</option>
            </select>
          </label>
        </div>
      </div>

      <div class="engine">
        <div class="engine-head">
          <label class="toggle"><input type="checkbox" id="opt-book"> Book</label>
          <button id="btn-book" class="small">Open book…</button>
          <input type="file" id="book-file" accept=".dat" hidden>
        </div>
        <div class="book-meta" id="book-meta"></div>
        <div class="book-note">
          <span id="book-note"></span>
          <button id="btn-book-forget" class="link" hidden title="Delete the saved copy of the book (and its Umigame numbers) from this browser">Forget</button>
        </div>
        <div class="engine-status analyse-only" id="book-status"></div>
        <div class="engine-lines analyse-only" id="book-lines"></div>
      </div>

      <div class="analyse-only">
        <div class="engine">
          <div class="engine-head">
            <label class="toggle"><input type="checkbox" id="opt-edax"> Edax analysis</label>
            <label class="level">Level
              <select id="opt-level">
                <option>1</option><option>4</option><option>8</option><option>12</option>
                <option>16</option><option>18</option><option>20</option><option>21</option>
                <option>24</option><option>26</option><option>28</option><option>30</option>
              </select>
            </label>
          </div>
          <div class="engine-status" id="engine-status">Off</div>
          <div class="engine-lines" id="engine-lines"></div>
        </div>
      </div>

      <div class="section-title">Moves</div>
      <div class="moves" id="moves"></div>

      <div class="analyse-only">
        <div class="section-title">Transcript</div>
        <textarea id="transcript" spellcheck="false" placeholder="Paste a game, e.g. f5d6c3d3c4f4"></textarea>
        <div class="row">
          <button id="btn-load">Load</button>
          <button id="btn-copy">Copy</button>
          <span class="msg" id="msg"></span>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
